# Executes a tlc-spec-driven feature already specified and committed on the
# branch. Spec-first flow: the feature spec is born interactively (tlc Specify/
# Design/Tasks in a Claude Code session — the phases that need a human to
# answer gray areas); here it only gets implemented, reviewed, independently
# verified, synced into the capability contract and turned into a PR.
#
# Two properties of the GRAPH, not of any prompt:
#
#  1. Author != verifier. `implement` and `verify` are separate nodes with
#     fresh context. The verifier never inherits the implementer's mental
#     model — an instruction could be relaxed; a node boundary cannot.
#
#  2. Nothing mutates after the verification stamp. Review and fixes happen
#     BEFORE `verify`, so `validation.md` always describes exactly the code
#     that reaches the PR. Ordering the pipeline this way is what removes the
#     need for a reconciliation pass at the end.
name: tlc-apply-feature
description: |
  Use when: A tlc feature spec is ready (.specs/features/<slug>/spec.md,
  plus design.md/tasks.md when the feature is Large/Complex) and committed on
  a branch, and the user wants Archon to implement it, review it, verify it
  independently, sync .specs/capabilities/ and open the PR.
  Triggers: "apply the feature", "apply feature <slug>", "implement feature
            <slug>", "aplica a feature", "implementa .specs/features/<slug>".
  NOT for: Writing feature specs (that is interactive — tlc-spec-driven
           Specify/Design/Tasks in a Claude Code session), bugs, GitHub issues,
           database-only changes, or treating PR review findings. Those had
           workflows of their own until 2026-08-04 and are handled in a session
           for now — see the Backlog in .archon/README.md. This is the ONLY
           workflow in the pilot.

  How to invoke (the spec must be visible in the worktree — Archon creates the
  work branch from main, so point the start point at the spec branch):
    archon workflow run tlc-apply-feature --from <spec-branch> --branch <slug> "apply feature <slug>"

provider: claude
model: medium

nodes:
  # ═══════════════════════════════════════════════════════════════
  # 1. FIND THE SPEC
  # ═══════════════════════════════════════════════════════════════

  - id: extract-slug
    # No retry: a rate limit is not transient — see WORKFLOWS.md.
    retry:
      max_attempts: 1
    prompt: |
      Identify the slug of the requested tlc feature.

      Request: $ARGUMENTS

      List the directories under `.specs/features/` and pick the one matching
      the request. If the request names the slug literally, use it.

      CRITICAL: your final output must be ONLY the slug, no quotes, no
      markdown, no explanation. Example correct output: bloqueio-recorrente
    model: small

  - id: verify-feature
    bash: |
      # $extract-slug.output is injected pre-quoted by Archon — do not quote it.
      SLUG=$(echo $extract-slug.output | tr -d '[:space:]')
      DIR=".specs/features/$SLUG"
      if [ ! -f "$DIR/spec.md" ]; then
        echo "Feature '$SLUG' not found at $DIR (expected spec.md)." >&2
        echo "The spec must be committed and visible in this worktree: write it interactively" >&2
        echo "(tlc-spec-driven Specify/Design/Tasks), commit it on a branch and invoke this" >&2
        echo "workflow with --from <spec-branch>." >&2
        exit 1
      fi
      echo "$SLUG" > "$ARTIFACTS_DIR/.feature-slug"
      # Fingerprint of the inputs that decide a conflict with an ADR (the spec
      # + the accepted decisions), taken BEFORE implement. The adr-gate
      # recomputes it afterwards: that is what tells a freshly detected
      # conflict from a stale marker surviving a --resume.
      .archon/scripts/adr-inputs-fingerprint.sh "$SLUG" > "$ARTIFACTS_DIR/.adr-inputs"
      echo "Feature spec ok: $DIR"
      ls "$DIR"
      [ -f "$DIR/tasks.md" ] || echo "note: no tasks.md (Small/Medium feature — tasks are implicit, listed inline at Execute)"
    depends_on: [extract-slug]

  # The implement switch: "is there an open checkbox left in tasks.md?". Bash
  # node, zero model cost — the answer comes from a grep, not from an agent.
  #
  # printf without \n on purpose: `when:` compares the literal output, and a
  # trailing newline would break the equality. If the comparison still fails,
  # it fails on the safe side — it differs from NONE, implement runs, and the
  # worst outcome is the cost that exists today.
  #
  # Without tasks.md (Small/Medium feature, implicit tasks) there is nothing to
  # count: PENDING, implement decides.
  - id: remaining-tasks
    bash: |
      SLUG=$(cat "$ARTIFACTS_DIR/.feature-slug" | tr -d '[:space:]')
      T=".specs/features/$SLUG/tasks.md"
      if [ ! -f "$T" ]; then
        printf '%s' "PENDING"
      elif grep -q '^- \[ \]' "$T"; then
        printf '%s' "PENDING"
      elif ! grep -q '^- \[' "$T"; then
        # tasks.md with no checkbox at all: format outside the contract. Waking
        # implement for nothing costs one model entry; concluding NONE on top
        # of an unexpected format cost the whole run c4f50068 (implement
        # silently skipped, 2026-08-07). Fail-safe: treat as pending.
        printf '%s' "PENDING"
      else
        printf '%s' "NONE"
      fi
    depends_on: [verify-feature]

  # ═══════════════════════════════════════════════════════════════
  # 2. IMPLEMENT
  # ═══════════════════════════════════════════════════════════════

  - id: implement
    # No retry: a rate limit is not transient — see WORKFLOWS.md.
    retry:
      max_attempts: 1
    prompt: |
      Implement the tlc feature in this repository. The slug is in
      `$ARTIFACTS_DIR/.feature-slug`; the feature lives at `.specs/features/<slug>/`.

      You are the AUTHOR node. An independent verifier runs after you in a
      separate context — do not self-certify; your job is to implement and
      leave honest evidence.

      Process — follow the tlc-spec-driven execution contract
      (`.agents/skills/tlc-spec-driven/SKILL.md` and its
      `references/implement.md`, read completely before starting):
      1. Read `.specs/features/<slug>/spec.md` (+ `design.md` and `tasks.md`
         when present, and `context.md` for user decisions). Read the
         Decisions section of `.specs/STATE.md` if it exists. Read the domain
         glossary in `docs/en/production-architecture.md` section 1 (use ITS
         terms for names in code, tables and columns; a name that contradicts
         the glossary is a defect — and note that Angolan regulatory terms are
         never translated, per `AGENTS.md`) and any `docs/en/adr/` entry that
         constrains this feature (architectural decisions already taken — do not re-decide
         them).

         **ADR conflict = hard stop.** If the spec DIRECTLY contradicts an
         accepted ADR (the ADR decides X, the spec requires not-X), do NOT
         write code and do NOT rewrite the ADR: superseding an architectural
         decision is the owner's call, and doing it in passing is exactly what
         "do not re-decide" forbids. Instead, before touching any source file,
         write `$ARTIFACTS_DIR/.adr-conflict` naming the ADR file and quoting
         both sides, then stop — a gate node halts the run for the owner.
         A spec that merely does not mention an ADR is NOT a conflict, and
         neither is an ADR that leaves the point open: the bar is direct
         contradiction, because a spurious halt costs a run.
      2. Load confirmed lessons:
         `python3 .agents/skills/tlc-spec-driven/scripts/lessons.py list --status confirmed`
      3. If there is no tasks.md, START by listing the atomic steps inline, then
         execute them in order. If there is a tasks.md, execute its tasks in
         order, ticking each checkbox (`- [ ]` → `- [x]`) as it completes.
      4. Per task, non-negotiable: tests derive from the spec's acceptance
         criteria and assert spec-defined outcomes (never mirror the
         implementation); the gate must pass before the task is done; one
         atomic commit per task; never weaken, skip or delete tests to make
         them pass.

      Headless adaptations (this workflow has no user to ask):
      - Never pause to ask questions. The spec was already approved by the
        project owner in the interactive phases — follow it; do not re-decide
        scope. If something is impossible or contradictory, take the smallest
        reasonable interpretation and record it in implementation.md.
      - Do not offer batch sub-agents (that offer needs a user to accept) —
        execute all tasks inline, in order.
      - Validation in tlc has three levels. Level 1 (per-task self-check:
        "Done when" criteria + the gate passing before each commit) is YOURS
        and is mandatory — run it on every task. Level 2 (feature-level
        validation per `references/validate.md`: evidence-or-zero, capability
        regression, discrimination sensor) is NOT yours: a separate verify node
        runs it with fresh eyes, because author self-certification is exactly
        what this pipeline exists to prevent. Do not run level 2 and do not
        write `validation.md`.

      Repo rules for every task: read `AGENTS.md` at the repo root and follow
      it — language policy, layer boundaries (ADR-003), the three test suites
      and which one a change owes, the toolchain. It is the single source of
      those rules on purpose: restating them here would create a second copy
      that drifts from the first, which is what happened in the project this
      workflow came from.

      At the end run `pnpm gate`, fix whatever
      breaks, and write `$ARTIFACTS_DIR/implementation.md` with what was done,
      decisions taken, deviations from the spec (if any) and anything left out.
      It is a run artifact, not a repo file: the durable record of HOW the
      feature was built is the commit history (one atomic commit per task, with
      the reasoning in the body), and duplicating it into the branch would add a
      file per feature that drifts from the code it describes.
    depends_on: [remaining-tasks]
    # Cheap resume. implement is `context: fresh`, so in a new run it does not
    # know work already exists: it has to re-read the spec, design, tasks, the
    # whole skill and the code just to DISCOVER there is nothing to do. That
    # cost 27 and 38 Opus calls across two resumes of the `avaliacoes` feature,
    # producing nothing. The grep answers the same question before waking Opus.
    #
    # The one that already implemented only what was missing is implement
    # itself, reading the checkboxes — this does not replace that, it only
    # avoids the cost of entering the node when no checkbox is left open.
    when: "$remaining-tasks.output != 'NONE'"
    context: fresh
    # `@author` (Claude/opus) — see the roles in `.archon/config.yaml`.
    model: "@author"

  # Deterministic gate for layer 2 (decisions), same pattern as verdict-gate:
  # the agent node persists the fact, bash greps it. A spec against an accepted
  # ADR is an architecture decision, and headless has nobody to ask — the flow
  # already halts on a product decision (NEEDS_SPEC in the router); this is the
  # same class. Proceeding would cost architectural integrity nobody re-audits
  # afterwards; halting costs one run.
  - id: adr-gate
    bash: |
      CONFLICT="$ARTIFACTS_DIR/.adr-conflict"
      if [ ! -s "$CONFLICT" ]; then
        echo "adr-gate ok: no conflict with the accepted ADRs"
        exit 0
      fi

      # Marker present. It only holds for the inputs implement saw: --resume
      # does not re-run a node that already passed, so a marker from a previous
      # execution would survive you fixing the spec and lock the flow forever.
      # The fingerprint separates the two cases.
      #
      # What is NOT done here is deleting the marker on read: on the next
      # --resume the gate would pass without implement having run, with zero
      # code written, and the flow would go green all the way to an empty PR.
      # That trades a visible lock for a silent false positive — worse on both
      # axes.
      SLUG=$(cat "$ARTIFACTS_DIR/.feature-slug" | tr -d '[:space:]')
      BEFORE=$(cat "$ARTIFACTS_DIR/.adr-inputs" 2>/dev/null || echo "fingerprint-missing")
      AFTER=$(.archon/scripts/adr-inputs-fingerprint.sh "$SLUG")

      if [ "$BEFORE" != "$AFTER" ]; then
        echo "adr-gate: the spec or the ADRs changed since this conflict was recorded — stale marker." >&2
        echo "" >&2
        echo "Conflict recorded in the previous execution:" >&2
        cat "$CONFLICT" >&2
        echo "" >&2
        echo "The inputs are no longer the same, so this marker decides nothing. The one that" >&2
        echo "needs to re-evaluate is implement, and --resume does not re-run a node that already passed:" >&2
        echo "run the workflow again from the start, with the spec and the ADRs already fixed." >&2
        exit 1
      fi

      echo "adr-gate: the spec contradicts an accepted ADR — stopping before spending review and verification." >&2
      echo "" >&2
      cat "$CONFLICT" >&2
      echo "" >&2
      echo "Two valid paths, both with you in the middle:" >&2
      echo "  1. amend the spec to respect the ADR (tlc Specify, interactive);" >&2
      echo "  2. write a new ADR that supersedes the old one." >&2
      echo "An ADR is not re-decided in passing: either the spec yields, or the decision is explicitly replaced." >&2
      echo "Once done, run from the start — not with --resume." >&2
      exit 1
    # Mandatory rewiring: implement can now be SKIPPED (when), and a skipped
    # node does not count as a successful parent — with `depends_on:
    # [implement]` alone, adr-gate would be skipped in cascade and the run
    # would end green having done nothing, which is the worst possible outcome
    # here. remaining-tasks always completes, so the gate stays alive on both
    # paths.
    #
    # `none_failed_min_one_success`, NOT `one_success` — the difference has
    # consequences and was measured in a probe:
    #
    #   failed parent  + completed parent → one_success RUNS the child
    #                                       none_failed_min_one_success SKIPS
    #   skipped parent + completed parent → both RUN the child
    #
    # With `one_success`, an implement that FAILS midway released the whole
    # pipeline (validate → review → fix → verify → create-pr) on a half-built
    # feature, because remaining-tasks beside it had completed. The test gate
    # does not catch that: code that was never written breaks no test.
    # `none_failed_min_one_success` blocks the failed parent and still lets the
    # skipped parent through, which is exactly the pair of behaviours this node
    # needs.
    depends_on: [implement, remaining-tasks]
    trigger_rule: none_failed_min_one_success

  # Repo gate (CLAUDE.md): lint + typecheck + unit tests, plus pgTAP when the
  # branch touches a migration or RLS.
  #
  # Bash, not an agent. implement already ends by running this same gate and
  # fixing what breaks; an agent here would repeat the work and, worse, report
  # the red honestly and let the pipeline continue — that is why a second
  # deterministic gate used to sit right after it. One gate that is an
  # `exit 1` does the job of both. Zero model cost.
  - id: validate
    bash: .archon/scripts/repo-gate.sh
    depends_on: [adr-gate]
    # Archon's default for a bash node is 120s and the suite does not fit in it:
    # measured on `avaliacoes`, lint + typecheck + 178 tests took ~1min40, and
    # pgTAP adds on top. Blowing the ceiling kills the whole RUN. 15 min is a
    # hang-catcher, not a budget; since the node runs no model, the slack costs
    # clock, never credit.
    timeout: 900000

  # The review was split into `review` (reads and triages) + `fix` (fixes) on
  # 2026-08-06. The single `review-fix` node did both, and its command
  # (`commands/tlc-review-fix.md`) stays in the repo, untouched, as the way
  # back: reverting is swapping these four nodes for one again.
  #
  # The reason for the split is one rule: **writing source code stays on
  # Claude**. Separated, the reviewer can run on another model family — and
  # then `author ≠ reviewer` stops being "separate node, same family" and
  # becomes different training, different blind spots. It is the property that
  # let CodeRabbit find, on PR #44, what this pipeline's "project rules" lens
  # declared nonexistent.
  #
  # Side effect that matters: read-only becomes a property of the GRAPH instead
  # of a promise in the prompt. The node that reviews has nowhere to write.
  # Clears the marker BEFORE reviewing. `$ARTIFACTS_DIR` survives the attempt
  # (it is where `resume` reads state from), so a `.must-fix` written by a
  # previous review that did not reach the end would stay there: the new review
  # would come back clean, would not create the file — and `remaining-must-fix`
  # would wake `fix` with stale findings, against a `review.md` already
  # rewritten on top.
  #
  # In bash and as a separate node for the same reason as `validate`: the gate
  # cannot depend on the agent remembering to clean up. And since a completed
  # node does not re-run on `resume`, resuming the run *after* the review keeps
  # its marker.
  - id: clear-must-fix
    bash: rm -f "$ARTIFACTS_DIR/.must-fix"
    depends_on: [validate]

  - id: review
    # No retry: a rate limit is not transient — see WORKFLOWS.md.
    retry:
      max_attempts: 1
    command: tlc-review
    depends_on: [clear-must-fix]
    context: fresh
    # Swapping for `medium` moves the review back to Claude without touching
    # anything else.
    model: "@reviewer"

  # Same pattern as `adr-gate` and `remaining-tasks`: the agent node persists
  # the fact in a file, bash greps it. Zero model cost, and `fix` does not wake
  # when the review came back clean — which should be the common case.
  #
  # printf without \n on purpose: `when:` compares the literal output.
  - id: remaining-must-fix
    bash: |
      if [ -s "$ARTIFACTS_DIR/.must-fix" ]; then
        printf '%s' "YES"
      else
        printf '%s' "NO"
      fi
    depends_on: [review]

  - id: fix
    # No retry: a rate limit is not transient — see WORKFLOWS.md.
    retry:
      max_attempts: 1
    command: tlc-fix-review
    depends_on: [remaining-must-fix]
    when: "$remaining-must-fix.output == 'YES'"
    context: fresh
    # `@fixer` (Claude) — this node WRITES. See the rule in the block header
    # and the roles in `.archon/config.yaml`.
    model: "@fixer"

  # `fix` touched the code after `validate`, so the gate runs again — and it
  # runs in bash, not on the word of the node that fixed. Same principle as
  # `capability-gate`: the agent says it ran the check, this one runs it.
  #
  # Skipped in cascade when `fix` is skipped, which is the common path: with no
  # fix, the tree is the same one `validate` already approved.
  - id: validate-fix
    bash: .archon/scripts/repo-gate.sh
    depends_on: [fix]
    timeout: 900000

  # The Verifier contract lives in `commands/tlc-verify-feature.md`, not
  # inline, by inheritance: it had a second caller (the `re-stamp` of
  # `tlc-feature-e2e`, removed on 2026-08-04 together with the review loop). It
  # stayed a command because the contract is long and worth versioning apart —
  # today, with a single caller, inline would also be defensible.
  - id: verify
    # No retry: a rate limit is not transient — see WORKFLOWS.md.
    retry:
      max_attempts: 1
    command: tlc-verify-feature
    # The three parents cover the four outcomes of the review, and the choice
    # of `trigger_rule` is the same one measured in a probe and documented on
    # `adr-gate`:
    #
    #   fix skipped + validate-fix skipped + gate ok → RUNS (review clean)
    #   fix ok      + validate-fix ok      + gate ok → RUNS (fixed and stayed green)
    #   fix failed                                   → SKIPS
    #   validate-fix failed                          → SKIPS (the fix broke the gate)
    #
    # `one_success` would let the last two through, because
    # `remaining-must-fix` always completes beside them.
    depends_on: [fix, validate-fix, remaining-must-fix]
    trigger_rule: none_failed_min_one_success
    context: fresh
    # medium by design: AUTHOR ≠ VERIFIER is a property of the GRAPH (separate
    # node + `context: fresh`), not of the model's size. See "Who runs each
    # node, and why `verify`/`re-verify` stay on medium" in WORKFLOWS.md.
    #
    # The `@verifier` alias (Codex) exists in the config and is NOT wired here
    # on purpose: this node uses `output_format`, and the structured verdict is
    # what triggers the `when` of `fix-gaps`. It is not verified that the Codex
    # adapter honours it. Wire it after measuring on a real feature.
    model: medium
    output_format:
      type: object
      properties:
        verdict:
          type: string
          enum: ["PASS", "FAIL"]
        ranked_gaps:
          type: string
          description: Ranked gap list when FAIL; empty string when PASS.
      required:
        - verdict
        - ranked_gaps

  # One bounded fix round (the interactive flow allows 3; headless gets 1 —
  # if the re-verify still fails, the workflow halts for the owner).
  - id: fix-gaps
    # No retry: a rate limit is not transient — see WORKFLOWS.md.
    retry:
      max_attempts: 1
    prompt: |
      The independent verifier FAILED this feature. Implement the fixes.

      Feature slug: `$ARTIFACTS_DIR/.feature-slug`.
      Ranked gaps (from the verifier):

      $verify.output.ranked_gaps

      Full evidence: `.specs/features/<slug>/validation.md`. Context of what was
      built: `$ARTIFACTS_DIR/implementation.md` **when it exists** — on a
      resumed run `implement` was skipped and the report stayed in the previous
      run. In that case the source is `git log --format=full $BASE_BRANCH..HEAD`,
      which always exists and carries the same information: one commit per
      task, with the decision in the body.

      Rules:
      - Fix the gaps in ranked order. Strengthen tests where mutants survived —
        never delete or weaken a test to make a gap disappear.
      - Same repo rules as the implementation: `AGENTS.md` at the repo root,
        one atomic commit per fix.
      - Re-run `pnpm gate` before finishing.
      - Your commit messages ARE the record of what you fixed — one atomic
        commit per fix, with the reasoning in the body. Do not write a separate
        report file.
    depends_on: [verify]
    when: "$verify.output.verdict == 'FAIL'"
    context: fresh
    # `@fixer` (Claude) — this node WRITES, from the ranked gaps the verifier
    # flagged. Same role as `fix`: the discovery is done, here it is applied.
    # See the roles in `.archon/config.yaml`.
    model: "@fixer"

  - id: re-verify
    # No retry: a rate limit is not transient — see WORKFLOWS.md.
    retry:
      max_attempts: 1
    prompt: |
      You are the independent VERIFIER, second (and last) round. A fix pass ran
      after your predecessor's FAIL. Fresh eyes, same contract: re-read
      `.agents/skills/tlc-spec-driven/references/validate.md` completely and
      re-run steps 1–10 from scratch against the current diff — do not diff
      against the previous report; re-derive. The two extra sweeps (coverage
      code → test, documentation drift) apply here too.

      Feature slug: `$ARTIFACTS_DIR/.feature-slug`.

      Same hard rules as before: read-only over code, sensor in scratch state,
      rewrite `.specs/features/<slug>/validation.md` (the `**Commit
      verificado**` field MUST carry the output of
      `git log -1 --format=%H -- . ':!.specs'` — the last commit that touched
      CODE, never a raw `git rev-parse HEAD`, which the evidence commits move
      before anyone can compare it — and the `**Overall**:` line MUST contain
      `✅ Ready`, `⚠️ Issues` or `❌ Not Ready`, and must agree with your
      structured `verdict`: `✅ Ready` ⇔ `PASS`, the other two ⇔ `FAIL`),
      distill lessons, commit only the verification artifacts, end with the
      compact summary.

      If the verdict is still FAIL, say so plainly — the workflow halts and the
      owner decides. Do not soften the verdict to let it pass.
    depends_on: [fix-gaps]
    context: fresh
    # medium by design: AUTHOR ≠ VERIFIER is a property of the GRAPH (separate
    # node + `context: fresh`), not of the model's size. See "Who runs each
    # node, and why `verify`/`re-verify` stay on medium" in WORKFLOWS.md.
    #
    # The `@verifier` alias (Codex) exists in the config and is NOT wired here
    # on purpose: this node uses `output_format`, and the structured verdict is
    # what triggers the `when` of `fix-gaps`. It is not verified that the Codex
    # adapter honours it. Wire it after measuring on a real feature.
    model: medium

  # Deterministic gate: the contract and the PR only happen for a feature whose
  # persisted report says Ready. Grep, not model judgement — an agent talks
  # itself into "it's fine"; a grep does not.
  - id: verdict-gate
    bash: |
      SLUG=$(cat "$ARTIFACTS_DIR/.feature-slug" | tr -d '[:space:]')
      .archon/scripts/verdict-gate.sh ".specs/features/$SLUG/validation.md" tlc
    depends_on: [verify, re-verify]
    # Here `one_success` is the right one, unlike adr-gate — do not swap it for
    # `none_failed_min_one_success` without reading this. The difference is the
    # structure of the parents, not taste:
    #
    # - `re-verify` only exists when `verify` returned FAIL, and in that case
    #   the persisted report says "not Ready". So the only way to reach this
    #   node with a broken re-verify is with a report that fails — the script
    #   halts, and with a better message than a cascaded skip would give. That
    #   is what happened on 2026-07-31 (re-verify killed by quota).
    # - if `verify` breaks as a NODE, `fix-gaps` and `re-verify` vanish in
    #   cascade, and `one_success` skips this gate with them: measured in a
    #   probe, failed parent + skipped parent, none completed, does not trigger
    #   the child.
    #
    # In other words: there is no path that reaches here with an approving
    # report without a verifier having completed. adr-gate was different
    # because it had a sibling (`remaining-tasks`) that ALWAYS completes beside
    # a node that can fail — there `one_success` let a broken implement through.
    trigger_rule: one_success

  # A command, not an inline prompt, for the same reason as `verify`: it had a
  # second caller (the `re-sync` of `tlc-feature-e2e`, removed on 2026-08-04)
  # and the contract is worth versioning apart.
  - id: sync-capabilities
    # No retry: a rate limit is not transient — see WORKFLOWS.md.
    retry:
      max_attempts: 1
    command: tlc-sync-capabilities
    depends_on: [verdict-gate]
    context: fresh

  # Same principle as verdict-gate, one level up: the sync node says it ran the
  # check, this one runs it. A malformed (or edited and uncommitted) contract
  # does not reach the PR — the sync node's word is not the evidence.
  - id: capability-gate
    bash: |
      set -euo pipefail
      python3 .agents/skills/capability-sync/scripts/capabilities.py check
      # BOTH checks: `git diff` sees the worktree, `--cached` sees the index.
      # The first alone let through the easiest case to happen — the node runs
      # `git add` and forgets the commit; the file vanishes from the
      # worktree-diff and the gate approves a contract that is not on the
      # branch.
      if ! git diff --quiet -- .specs/capabilities || ! git diff --cached --quiet -- .specs/capabilities; then
        echo "Uncommitted edits in .specs/capabilities — sync-capabilities must commit them." >&2
        git status --short -- .specs/capabilities >&2
        exit 1
      fi
    depends_on: [sync-capabilities]

  - id: create-pr
    # No retry: a rate limit is not transient — see WORKFLOWS.md.
    retry:
      max_attempts: 1
    prompt: |
      Create a pull request for the current branch. The code has already been
      reviewed AND independently verified — this PR is a finished piece of
      work, not a work in progress.

      ## Context

      - **tlc feature**: slug in `$ARTIFACTS_DIR/.feature-slug` (dir `.specs/features/<slug>/`)
      - **Request**: $ARGUMENTS

      ## Instructions

      1. **Guard the stamp, then commit evidence only.** Run `git status --porcelain`
         (it lists staged AND unstaged AND untracked — check all three). Classify every
         entry:

         a. **Scratch** — ignore it, never commit it, and it does NOT block:
            - `.pr-body.md`, `pr-body.md`, `*.scratch.md`, `*.tmp.md` at any path
            - `review/`, `*-report.md` at the repo root
            - anything under `$ARTIFACTS_DIR`

         b. **Evidence** — an allowlist of **exact files this flow generates**, and
            nothing else. Not a directory, not a glob:
            - `.specs/features/<slug>/validation.md`
            - `.specs/LESSONS.md`
            - `.specs/lessons.json`

            Stage them by name with `git add <path1> <path2> ...` — never `git add -A`,
            `git add .` or `git add -u` — and commit them.

            The rest of `.specs/features/<slug>/` is **input, not evidence**: `spec.md`,
            `design.md`, `tasks.md`, `context.md` are written interactively *before* the
            run and are what the Verifier measured the code against. A dirty `spec.md`
            here means the anchor moved after the report was stamped — `validation.md`
            would claim conformance to a spec that no longer exists. And this drift is
            the one the later check **cannot** catch: the stamp is
            `git log -1 --format=%H -- . ':!.specs'`, which excludes `.specs/` on
            purpose, so committing a moved spec as "evidence" buries it for good.

            `.specs/capabilities/` is not on the list either. It is the living contract,
            not evidence: the `capability-gate` immediately before this node already ran
            `capabilities.py check` and proved the directory clean in the worktree AND
            the index. Anything dirty there now means that guarantee broke after the gate.

         c. **Anything else is a hard stop** — source code, and any dirty path under
            `.specs/` that is not one of the three files above. Do not commit it, do not
            stage it, do not try to fix it. Print the file list, name which guarantee
            broke (source changed after the independent verification / the spec anchor
            moved after the stamp / the capability contract moved after its gate), and
            **fail this node** (exit non-zero / report failure — do not open the PR).

         Why (c) is a failure and not a commit: the `verify` node stamped
         `validation.md` with the code it saw, and every node after it is evidence-only.
         Source dirty at this point means either the implementation never finished or
         something edited code after the verdict — in both cases the report attached to
         this PR would describe code that does not exist. This is the "nothing mutates
         after the stamp" guarantee, and it is worth more than an automatic recovery. A
         human decides: re-run the verifier, or drop the change.
      2. Push the branch: `git push -u origin HEAD`
      3. Read for context: `git log --format=full $BASE_BRANCH..HEAD` (the source
         that always exists — one commit per task, with the decision in the body),
         `.specs/features/<slug>/validation.md`, `$ARTIFACTS_DIR/implementation.md`
         if it exists, `$ARTIFACTS_DIR/review.md` (the review triage) and the
         feature's `spec.md`.
      4. Check if a PR already exists for this branch: `gh pr list --head $(git branch --show-current)`
         - If PR exists, skip creation and capture its number
      5. Look for the project's PR template at `.github/pull_request_template.md`, `.github/PULL_REQUEST_TEMPLATE.md`, or `docs/PULL_REQUEST_TEMPLATE.md`. Read whichever one exists.
      6. Create the PR: `gh pr create --base $BASE_BRANCH`
         - Title: English, following the repo's conventional commit style, under 70 chars
         - Body (English): summary, changes, verification evidence (verdict,
           spec-anchored coverage, sensor result — from validation.md), what
           the review found and what was refused with the reason, and a link
           to the feature (`.specs/features/<slug>/`). If spec.md or the
           request cites an issue (#N), include `Closes #N`; if not, do not
           invent one.
         - **PR body file location**: if you write the body to a file (e.g. for `--body-file`), the file MUST live at `$ARTIFACTS_DIR/pr-body.md` or under `/tmp/` — NEVER inside the worktree.
      7. Capture PR identifiers:
         ```bash
         HEAD_BRANCH=$(git branch --show-current)
         PR_NUMBER=$(gh pr list --head "$HEAD_BRANCH" --state open --json number -q '.[0].number')
         if [ -z "$PR_NUMBER" ]; then
           echo "No open PR found for branch $HEAD_BRANCH — PR creation failed" >&2
           exit 1
         fi
         echo "$PR_NUMBER" > "$ARTIFACTS_DIR/.pr-number"
         PR_URL=$(gh pr view "$PR_NUMBER" --json url -q '.url')
         echo "$PR_URL" > "$ARTIFACTS_DIR/.pr-url"
         ```
    depends_on: [capability-gate]
    context: fresh

  - id: finalize
    bash: |
      set -euo pipefail
      SLUG=$(cat "$ARTIFACTS_DIR/.feature-slug" | tr -d '[:space:]')
      echo ""
      echo "── feature '$SLUG' done ──"
      echo "  evidence:   .specs/features/$SLUG/validation.md"
      echo "  contract:   .specs/capabilities/ (synced)"
      echo "  review:     \$ARTIFACTS_DIR/review.md"
      # Fixes the base, prints the PR and points at the next command (the
      # external review cycle is asynchronous and does not close here — see the
      # script).
      .archon/scripts/pr-finalize.sh
    depends_on: [create-pr]
