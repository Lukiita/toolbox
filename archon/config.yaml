# Archon configuration for this repository.
#
# `baseBranch` is pinned here, not in Archon's database, for a reason measured
# in the project this came from: Archon writes `default_branch` into the
# project record with whatever branch happened to be checked out at
# registration time. If that branch does not exist on the remote, v0.6.0
# refuses to create the worktree and every `--branch` dies on launch.
#
# Pinning `main` here keeps the decision visible and versioned, instead of
# depending on what got written into one machine's database.
worktree:
  baseBranch: main

# Model aliases by ROLE. A node uses one with `model: "@name"` — the field is
# `model:`, NOT `alias:`, which Archon silently ignores (checked with `archon
# validate workflows` on v0.6.0: an unknown alias in `model:` is an error; a
# stray `alias:` passes without a word).
#
# They live here, not in `archon ai alias set`, so they are versioned and
# travel with the repo. Repo config wins over global.
#
# **The alias names the role; the tier names the size.** `small`/`medium`/
# `large` still apply and are global — a mechanical node (extract-slug,
# create-pr) uses a tier, because there the only question is "how capable does
# it need to be". A node with a role in the design uses an alias, because the
# question is "who does this work", and the answer can change family without
# changing size.
#
# One alias per role, not one per family, precisely so two roles in the same
# family can diverge: `@author` and `@fixer` are both Claude, but the author
# starts from a spec and the fixer starts from a precise `file:line` list —
# different work, different size.
#
# Cost: both providers come from subscriptions, not API keys. Archon drives the
# local BINARIES (`archon doctor` confirms: "Claude binary … Codex binary …",
# with "AI credentials: none connected"), so whoever authenticates is the
# `claude` and `codex` already logged in on the machine.
aliases:
  # ── write source code: Claude ──────────────────────────────────────────────

  # Implements the feature from the spec. The most expensive role in the flow:
  # it starts from a document and decides how it becomes code.
  "@author":
    provider: claude
    model: opus

  # Applies fixes that ANOTHER context flagged (`fix`, `fix-gaps`). It starts
  # from a precise list — `file:line` + what is wrong — so it does not need the
  # author's size: the discovery work is already done.
  "@fixer":
    provider: claude
    model: sonnet

  # ── read and report only: another family ───────────────────────────────────
  #
  # The family swap is the point. `author != reviewer` stops being "separate
  # node, same family" and becomes different training with different blind
  # spots — the property that let CodeRabbit find, on PR #44, the Major in
  # `locked-fields.ts` that this pipeline's "project rules" lens declared
  # nonexistent.
  #
  # v0.6.0 caveats: Codex always runs with `danger-full-access` (no sandbox),
  # and `effort` is accepted at validation but ignored at execution.
  #
  # `danger-full-access` enters here with its scope written down, not by
  # oversight: the diff `review` reads was written by the `implement` of the
  # SAME run, in this worktree, from a versioned spec — it is not a
  # third-party PR. If this pipeline ever reviews an external diff, this alias
  # needs external isolation (a container without credentials) FIRST, because
  # a read-only instruction in the prompt does not contain what a sandbox
  # would.

  # Reviews the diff and triages (`review`). Read-only by construction: the node
  # that uses this alias has no write step.
  "@reviewer":
    provider: codex
    model: gpt-5.6-sol

  # Independent verification against the spec (`verify`, `re-verify`) — heavier
  # work than the review: acceptance criteria traced one by one, capability
  # regression and the discrimination sensor.
  #
  # DEFINED BUT NOT WIRED. Those nodes use `output_format` (the structured
  # verdict that decides the `when` of `fix-gaps`), and it is not verified that
  # the Codex adapter honours it. If it does not, a FAIL stops triggering the
  # fix round and the run halts at `verdict-gate` — degraded but safe, because
  # the gate greps the persisted `validation.md`. Wire it only after measuring
  # on a real feature.
  "@verifier":
    provider: codex
    model: gpt-5.6-sol
